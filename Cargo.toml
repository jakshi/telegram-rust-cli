[package]
name = "tgrc"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Telegram CLI for reading messages from the terminal"
repository = "https://github.com/jakshi/telegram-rust-cli"
homepage = "https://github.com/jakshi/telegram-rust-cli"
readme = "README.md"
keywords = ["telegram", "cli", "tdlib", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
tdlib-rs = { version = "1.4", features = ["download-tdlib", "static"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rpassword = "5"
libc = "0.2"

[build-dependencies]
tdlib-rs = { version = "1.4", features = ["download-tdlib", "static"] }
