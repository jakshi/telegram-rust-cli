name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tgrc-${{ matrix.arch }}-apple-darwin.tar.gz tgrc
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgrc-${{ matrix.arch }}-apple-darwin
          path: tgrc-${{ matrix.arch }}-apple-darwin.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping creation"
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              artifacts/tgrc-arm64-apple-darwin/tgrc-arm64-apple-darwin.tar.gz \
              artifacts/tgrc-x86_64-apple-darwin/tgrc-x86_64-apple-darwin.tar.gz
          fi

  update-tap:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"

          # Download the release tarballs and compute checksums
          gh release download "$tag" \
            --repo jakshi/telegram-rust-cli \
            --pattern '*.tar.gz' \
            --dir .

          sha256_arm64=$(sha256sum tgrc-arm64-apple-darwin.tar.gz | awk '{print $1}')
          sha256_x86_64=$(sha256sum tgrc-x86_64-apple-darwin.tar.gz | awk '{print $1}')

          git clone "https://x-access-token:${GH_TOKEN}@github.com/jakshi/homebrew-tap.git"
          cd homebrew-tap

          mkdir -p Formula

          # Generate the formula
          cat > Formula/tgrc.rb << FORMULA
          class Tgrc < Formula
            desc "Telegram CLI for reading messages from the terminal"
            homepage "https://github.com/jakshi/telegram-rust-cli"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/jakshi/telegram-rust-cli/releases/download/${tag}/tgrc-arm64-apple-darwin.tar.gz"
                sha256 "${sha256_arm64}"
              else
                url "https://github.com/jakshi/telegram-rust-cli/releases/download/${tag}/tgrc-x86_64-apple-darwin.tar.gz"
                sha256 "${sha256_x86_64}"
              end
            end

            def install
              bin.install "tgrc"
            end

            test do
              assert_match "tgrc", shell_output("#{bin}/tgrc --help")
            end
          end
          FORMULA

          # Remove leading spaces from heredoc
          sed -i 's/^          //' Formula/tgrc.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/tgrc.rb; then
            echo "Homebrew tap already up to date"
          else
            git add Formula/tgrc.rb
            git commit -m "Update tgrc to ${version}"
            git push
          fi
