name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --check
